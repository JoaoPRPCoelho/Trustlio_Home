name: CPSC recall check

# Weekly check of every real product against the CPSC recall database. A failed
# run means a product needs a person to read a recall notice and update its
# trust inputs. Pull requests that touch products or the script also run a smoke
# test that the CPSC API still answers.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "data/products/**"
      - "scripts/check-recalls.mjs"
      - ".github/workflows/recalls.yml"

jobs:
  recalls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CPSC API smoke test
        run: node scripts/check-recalls.mjs --smoke
      - name: Check products
        run: node scripts/check-recalls.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recalls-report
          path: recalls-report.json
          if-no-files-found: ignore
